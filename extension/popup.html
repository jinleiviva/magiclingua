<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>MagicLingua</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header class="hd">
        <div class="brand">
            <span class="logo">
                <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
                    <path d="M7 10H15M11 10V18M11 10L7.5 18M11 10L14.5 18" stroke="#1C1C1E" stroke-width="1.7"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </span>
            <h1>MagicLingua</h1>
        </div>
        <div class="hd-right">
            <button id="backBtn" class="icon-btn hidden" title="返回主视图" aria-label="返回主视图">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                    <path d="M11 4 6 9l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </button>
            <h2 id="settingsTitle" class="settings-title hidden">设置</h2>
            <div class="status status-checking" id="status" role="status" aria-live="polite">
                <span class="dot"></span>
                <span id="statusText">检查中</span>
            </div>
            <button id="settingsBtn" class="icon-btn" title="设置" aria-label="设置">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                    <path d="M9 11.2a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4Z" stroke="currentColor" stroke-width="1.4" />
                    <path d="M7.7 2.6h2.6l.4 1.9c.5.16.95.38 1.35.66l1.78-.74 1.84 1.84-.74 1.78c.28.4.5.85.66 1.35l1.9.4v2.6l-1.9.4a6.3 6.3 0 0 1-.66 1.35l.74 1.78-1.84 1.84-1.78-.74c-.4.28-.85.5-1.35.66l-.4 1.9H7.7l-.4-1.9a6.3 6.3 0 0 1-1.35-.66l-1.78.74-1.84-1.84.74-1.78A6.3 6.3 0 0 1 2.4 9.9L.5 9.5V6.9l1.9-.4c.16-.5.38-.95.66-1.35l-.74-1.78 1.84-1.84 1.78.74A6.3 6.3 0 0 1 7.3 2l.4-1.4Z" stroke="currentColor" stroke-width="1.1" />
                </svg>
            </button>
        </div>
    </header>

    <div class="divider"></div>

    <!-- ===================== 主视图（高频动作） ===================== -->
    <main class="body view" id="viewMain">
        <!-- 当前站点：右侧开关关掉＝把该域名加入黑名单 -->
        <div class="site-row">
            <div class="site-left">
                <span class="fav">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M5 3h7l4 4v12H5z" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path d="M12 3v4h4" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </span>
                <span class="domain" id="currentSiteDomain">—</span>
            </div>
            <label class="switch" title="关闭后本站点不再翻译">
                <input type="checkbox" id="siteToggle" checked>
                <span class="track"><span class="knob"></span></span>
            </label>
        </div>

        <!-- 主行动：整页翻译 -->
        <button id="pageTranslateBtn" class="cta">翻译本页</button>

        <!-- 视频站：导出双语字幕（VideoAdapter 运行且拿到字幕轨时才显示） -->
        <button id="exportSubtitleBtn" class="sub-row hidden">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M3.5 8h9M8 3.5v9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <span>导出双语字幕 (SRT)</span>
        </button>

        <!-- 每页最常改：目标语言 + 显示模式 -->
        <div class="row">
            <label class="chip">
                <span class="chip-lab">目标语言</span>
                <select id="targetLanguage">
                    <optgroup label="常用">
                        <option value="Chinese">中文</option>
                        <option value="Traditional Chinese">繁體中文</option>
                        <option value="English">English</option>
                        <option value="Japanese">日本語</option>
                        <option value="Korean">한국어</option>
                        <option value="French">Français</option>
                        <option value="German">Deutsch</option>
                        <option value="Spanish">Español</option>
                        <option value="Russian">Русский</option>
                    </optgroup>
                    <optgroup label="欧洲语言">
                        <option value="Portuguese">Português</option>
                        <option value="Italian">Italiano</option>
                        <option value="Dutch">Nederlands</option>
                        <option value="Polish">Polski</option>
                        <option value="Czech">Čeština</option>
                        <option value="Ukrainian">Українська</option>
                    </optgroup>
                    <optgroup label="亚洲语言">
                        <option value="Thai">ไทย</option>
                        <option value="Vietnamese">Tiếng Việt</option>
                        <option value="Indonesian">Bahasa Indonesia</option>
                        <option value="Malay">Bahasa Melayu</option>
                        <option value="Filipino">Filipino</option>
                        <option value="Hindi">हिन्दी</option>
                        <option value="Bengali">বাংলা</option>
                        <option value="Tamil">தமிழ்</option>
                        <option value="Telugu">తెలుగు</option>
                        <option value="Urdu">اردو</option>
                        <option value="Gujarati">ગુજરાતી</option>
                        <option value="Marathi">मराठी</option>
                        <option value="Khmer">ខ្មែរ</option>
                        <option value="Burmese">မြန်မာ</option>
                    </optgroup>
                    <optgroup label="中东方言">
                        <option value="Turkish">Türkçe</option>
                        <option value="Arabic">العربية</option>
                        <option value="Persian">فارسی</option>
                        <option value="Hebrew">עברית</option>
                    </optgroup>
                    <optgroup label="中文变体与民汉互译">
                        <option value="Cantonese">粵語</option>
                        <option value="Tibetan">藏文</option>
                        <option value="Kazakh">哈萨克文</option>
                        <option value="Mongolian">蒙古文</option>
                        <option value="Uyghur">维吾尔文</option>
                    </optgroup>
                </select>
            </label>
            <label class="chip">
                <span class="chip-lab">网页显示</span>
                <select id="displayMode">
                    <option value="append">原文 + 译文</option>
                    <option value="replace">仅显示译文</option>
                </select>
            </label>
        </div>

        <!-- 文档翻译入口（PDF / EPUB / TXT / 字幕文件，独立任务入口） -->
        <a class="doc-row" id="openDocBtn" href="#" role="button">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M4 2h6l4 4v10H4z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                    stroke-linejoin="round" />
                <path d="M10 2v4h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
            <span>文档翻译（PDF / EPUB / TXT / 字幕）</span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </a>
    </main>

    <!-- ===================== 设置视图（低频配置） ===================== -->
    <main class="body view" id="viewSettings" hidden>

        <!-- 翻译行为 -->
        <section class="card">
            <div class="sec-title">翻译行为</div>
            <div class="row">
                <label class="pill">
                    <span>启用翻译</span>
                    <span class="switch sm">
                        <input type="checkbox" id="enabledToggle">
                        <span class="track"><span class="knob"></span></span>
                    </span>
                </label>
                <label class="pill">
                    <span>段落悬停翻译</span>
                    <span class="switch sm">
                        <input type="checkbox" id="hoverToggle">
                        <span class="track"><span class="knob"></span></span>
                    </span>
                </label>
            </div>
            <div class="row">
                <label class="pill">
                    <span>双语字幕</span>
                    <span class="switch sm">
                        <input type="checkbox" id="bilingualToggle">
                        <span class="track"><span class="knob"></span></span>
                    </span>
                </label>
                <label class="pill">
                    <span>PDF 对照</span>
                    <span class="switch sm">
                        <input type="checkbox" id="pdfBilingualToggle">
                        <span class="track"><span class="knob"></span></span>
                    </span>
                </label>
            </div>
            <div class="row">
                <label class="chip">
                    <span class="chip-lab">悬停触发键</span>
                    <select id="hoverModifier">
                        <option value="ctrl">Ctrl + 悬停</option>
                        <option value="alt">Alt + 悬停</option>
                    </select>
                </label>
            </div>
        </section>

        <!-- 译文样式 -->
        <section class="card">
            <div class="sec-title">译文样式</div>
            <div class="slider">
                <div class="sl-top">
                    <span>字号</span>
                    <span id="fontSizeValue">24px</span>
                </div>
                <input type="range" id="fontSize" min="14" max="40" step="2" value="24">
            </div>
            <div class="preset-lab">配色预设</div>
            <div class="preset-grid" id="stylePresets"></div>
            <div class="row">
                <label class="chip color-chip">
                    <span class="chip-lab">背景色</span>
                    <input type="color" id="styleBgColor" value="#000000">
                </label>
                <label class="chip color-chip">
                    <span class="chip-lab">文字色</span>
                    <input type="color" id="styleTextColor" value="#ffffff">
                </label>
            </div>
        </section>

        <!-- 术语表：内置词库勾选生效 + 用户自定义 + CSV 导入导出 -->
        <section class="card gloss" id="glossCard">
            <div class="gloss-head">
                <span class="sec-title">术语表</span>
                <span class="gloss-meta" id="glossCount"></span>
            </div>
            <p class="gloss-hint">勾选要生效的词库，未勾选的不参与翻译。启用越多翻译越慢，建议 1–2 个。</p>
            <div class="gloss-actions">
                <button id="importCsvBtn" class="btn-ghost">导入 CSV</button>
                <button id="exportCsvBtn" class="btn-ghost">导出 CSV</button>
                <input type="file" id="importCsvFile" accept=".csv,text/csv" hidden>
            </div>
            <div class="gloss-sec-title">内置词库</div>
            <div id="builtinGlossList" class="gloss-list"></div>
            <div class="gloss-sec-title">自定义</div>
            <label class="gloss-row" id="customGlossRow">
                <span class="switch sm">
                    <input type="checkbox" id="customGlossToggle">
                    <span class="track"><span class="knob"></span></span>
                </span>
                <span class="gloss-name">自定义条目</span>
                <span class="gloss-count" id="customGlossCount"></span>
            </label>
            <textarea id="customGlossaryInput" rows="4" spellcheck="false"
                placeholder="the Fed=美联储&#10;quantitative easing=量化宽松"></textarea>
        </section>

        <!-- 本地服务 -->
        <section class="card svc" id="serviceRow">
            <div class="svc-top">
                <span class="svc-dot"></span>
                <span class="svc-text">
                    <span id="serviceState">检查中…</span>
                    <span id="serviceHint">正在查询服务状态</span>
                </span>
                <button id="serviceToggleBtn" class="btn-ghost">启动</button>
            </div>
            <input type="text" id="serverUrl" class="addr" spellcheck="false">
        </section>
    </main>

    <script src="glossaries.js"></script>
    <script src="popup.js"></script>
</body>

</html>
