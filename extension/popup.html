<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>MagicLingua</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>
    <header class="hd">
        <button id="backBtn" class="back-btn hidden" title="返回主视图" aria-label="返回主视图">
            <svg width="14" height="14" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M11.5 4 6 9l5.5 5" stroke="currentColor" stroke-width="1.9"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>返回</span>
        </button>
        <div class="brand" id="brand">
            <span class="logo" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 26 26">
                    <rect width="26" height="26" rx="6" ry="6" fill="#050038" />
                    <g transform="translate(13 8.5)">
                        <rect x="-7" y="-0.8" width="14" height="1.6" rx="0.8" fill="#0FBCB0" />
                        <path d="M -7 -3 L -10 0 L -7 3 Z" fill="#0FBCB0" />
                        <path d="M 7 -3 L 10 0 L 7 3 Z" fill="#0FBCB0" />
                    </g>
                    <rect x="2.5" y="14" width="9.5" height="9.5" rx="2" ry="2" fill="#FFD02F" />
                    <rect x="14" y="14" width="9.5" height="9.5" rx="2" ry="2" fill="#0FBCB0" />
                </svg>
            </span>
            <h1>MagicLingua</h1>
        </div>
        <h2 id="settingsTitle" class="settings-title hidden">设置</h2>
        <div class="hd-right">
            <div class="status status-checking" id="status" role="status" aria-live="polite">
                <span class="dot"></span>
                <span id="statusText">检查中</span>
            </div>
            <button id="settingsBtn" class="icon-btn" title="设置" aria-label="设置">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.61 3.61 0 0 1 8.4 12c0-1.98 1.62-3.6 3.6-3.6s3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                </svg>
            </button>
        </div>
    </header>

    <div class="divider"></div>

    <!-- ===================== 主视图（高频动作） ===================== -->
    <main class="body view" id="viewMain">
        <!-- 服务行：左「启用翻译」开关 / 右「本地模型」状态+启停（左右对称两半） -->
        <div class="svc-row" id="serviceRow" title="">
            <label class="svc-half" title="关闭后网页不再自动翻译">
                <span class="svc-lab">启用翻译</span>
                <span class="switch sm">
                    <input type="checkbox" id="enabledToggle">
                    <span class="track"><span class="knob"></span></span>
                </span>
            </label>
            <span class="svc-divider" aria-hidden="true"></span>
            <div class="svc-half svc-model">
                <svg class="svc-icon" width="15" height="15" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                    <rect x="3.5" y="3.5" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.7" />
                    <rect x="7" y="7" width="4" height="4" rx="0.8" stroke="currentColor" stroke-width="1.7" />
                    <path d="M6.5 1.5v2M11.5 1.5v2M6.5 14.5v2M11.5 14.5v2M1.5 6.5h2M1.5 11.5h2M14.5 6.5h2M14.5 11.5h2"
                        stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                </svg>
                <span class="svc-text">
                    <span id="serviceState">检查中…</span>
                    <span id="serviceHint" hidden>正在查询服务状态</span>
                </span>
                <button id="serviceToggleBtn" class="btn-ghost">启动</button>
            </div>
        </div>

        <!-- 当前页面卡：域名 + 本站开关 + 目标语言 + 翻译本页（一个完整行动闭环） -->
        <div class="card site-card">
            <div class="site-head">
                <span class="fav" aria-hidden="true">
                    <svg width="12" height="12" viewBox="0 0 18 18" fill="none">
                        <path d="M4 2h6.5l3.5 3.5V15H4z" stroke="#FFFFFF" stroke-width="1.7"
                            stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M10.5 2v3.5H14" stroke="#FFFFFF" stroke-width="1.7"
                            stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </span>
                <span class="domain" id="currentSiteDomain">—</span>
                <span class="site-lab">本站翻译</span>
                <label class="switch sm" title="关闭后本站点不再翻译">
                    <input type="checkbox" id="siteToggle" checked>
                    <span class="track"><span class="knob"></span></span>
                </label>
            </div>
            <div class="row">
                <label class="chip">
                    <span class="chip-lab">目标语言</span>
                    <select id="targetLanguage">
                        <optgroup label="常用">
                            <option value="Chinese">中文</option>
                            <option value="Traditional Chinese">繁體中文</option>
                            <option value="English">English</option>
                            <option value="Japanese">日本語</option>
                            <option value="Korean">한국어</option>
                            <option value="French">Français</option>
                            <option value="German">Deutsch</option>
                            <option value="Spanish">Español</option>
                            <option value="Russian">Русский</option>
                        </optgroup>
                        <optgroup label="欧洲语言">
                            <option value="Portuguese">Português</option>
                            <option value="Italian">Italiano</option>
                            <option value="Dutch">Nederlands</option>
                            <option value="Polish">Polski</option>
                            <option value="Czech">Čeština</option>
                            <option value="Ukrainian">Українська</option>
                        </optgroup>
                        <optgroup label="亚洲语言">
                            <option value="Thai">ไทย</option>
                            <option value="Vietnamese">Tiếng Việt</option>
                            <option value="Indonesian">Bahasa Indonesia</option>
                            <option value="Malay">Bahasa Melayu</option>
                            <option value="Filipino">Filipino</option>
                            <option value="Hindi">हिन्दी</option>
                            <option value="Bengali">বাংলা</option>
                            <option value="Tamil">தமிழ்</option>
                            <option value="Telugu">తెలుగు</option>
                            <option value="Urdu">اردو</option>
                            <option value="Gujarati">ગુજરાતી</option>
                            <option value="Marathi">मराठी</option>
                            <option value="Khmer">ខ្មែរ</option>
                            <option value="Burmese">မြန်မာ</option>
                        </optgroup>
                        <optgroup label="中东方言">
                            <option value="Turkish">Türkçe</option>
                            <option value="Arabic">العربية</option>
                            <option value="Persian">فارسی</option>
                            <option value="Hebrew">עברית</option>
                        </optgroup>
                        <optgroup label="中文变体与民汉互译">
                            <option value="Cantonese">粵語</option>
                            <option value="Tibetan">藏文</option>
                            <option value="Kazakh">哈萨克文</option>
                            <option value="Mongolian">蒙古文</option>
                            <option value="Uyghur">维吾尔文</option>
                        </optgroup>
                    </select>
                </label>
                <label class="chip">
                    <span class="chip-lab">网页显示</span>
                    <select id="displayMode">
                        <option value="append">原文 + 译文</option>
                        <option value="replace">仅显示译文</option>
                    </select>
                </label>
            </div>
            <button id="pageTranslateBtn" class="cta">翻译本页</button>
        </div>

        <!-- 视频站：导出双语字幕（VideoAdapter 运行且拿到字幕轨时才显示） -->
        <button id="exportSubtitleBtn" class="sub-row hidden">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M8 2v8M4.5 7L8 10.5 11.5 7" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round" />
                <path d="M3 13.5h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
            <span class="sub-label">导出双语字幕 (SRT)</span>
        </button>

        <!-- 文档翻译入口（PDF / EPUB / TXT / 字幕文件，独立任务入口） -->
        <a class="doc-row" id="openDocBtn" href="#" role="button">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                <path d="M4 2h6.5l3.5 3.5V15H4z" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round" />
                <path d="M10.5 2v3.5H14" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span>文档翻译（PDF / EPUB / TXT / 字幕）</span>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                <path d="M6 3.5 10.5 8 6 12.5" stroke="currentColor" stroke-width="1.7"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </a>
    </main>

    <!-- ===================== 设置视图（低频配置） ===================== -->
    <main class="body view" id="viewSettings" hidden>

        <!-- 翻译行为 -->
        <section class="card">
            <div class="sec-title">翻译行为</div>
            <div class="row">
                <label class="pill">
                    <span>段落悬停翻译</span>
                    <span class="switch sm">
                        <input type="checkbox" id="hoverToggle">
                        <span class="track"><span class="knob"></span></span>
                    </span>
                </label>
                <label class="pill">
                    <span>双语字幕</span>
                    <span class="switch sm">
                        <input type="checkbox" id="bilingualToggle">
                        <span class="track"><span class="knob"></span></span>
                    </span>
                </label>
            </div>
            <div class="row">
                <label class="pill">
                    <span>PDF 对照</span>
                    <span class="switch sm">
                        <input type="checkbox" id="pdfBilingualToggle">
                        <span class="track"><span class="knob"></span></span>
                    </span>
                </label>
                <label class="chip">
                    <span class="chip-lab">悬停触发键</span>
                    <select id="hoverModifier">
                        <option value="ctrl">Ctrl + 悬停</option>
                        <option value="alt">Alt + 悬停</option>
                    </select>
                </label>
            </div>
        </section>

        <!-- 译文样式 -->
        <section class="card">
            <div class="sec-title">译文样式</div>
            <div class="slider">
                <div class="sl-top">
                    <span>字号</span>
                    <span id="fontSizeValue">24px</span>
                </div>
                <input type="range" id="fontSize" min="14" max="40" step="2" value="24">
            </div>
            <div class="preset-grid" id="stylePresets"></div>
            <div class="row">
                <label class="chip color-chip">
                    <span class="chip-lab">背景色</span>
                    <input type="color" id="styleBgColor" value="#000000">
                </label>
                <label class="chip color-chip">
                    <span class="chip-lab">文字色</span>
                    <input type="color" id="styleTextColor" value="#ffffff">
                </label>
            </div>
        </section>

        <!-- 术语表：内置词库勾选生效 + 用户自定义 + CSV 导入导出 -->
        <section class="card gloss" id="glossCard">
            <div class="gloss-head">
                <div class="sec-title">术语表</div>
                <div class="gloss-actions">
                    <button id="importCsvBtn" class="btn-ghost">导入 CSV</button>
                    <button id="exportCsvBtn" class="btn-ghost">导出 CSV</button>
                    <input type="file" id="importCsvFile" accept=".csv,text/csv" hidden>
                </div>
            </div>
            <div id="builtinGlossList" class="gloss-list"></div>
            <div class="gloss-divider" aria-hidden="true"></div>
            <div class="gloss-row" id="customGlossRow">
                <span class="switch sm" id="customGlossSwitch">
                    <input type="checkbox" id="customGlossToggle">
                    <span class="track"><span class="knob"></span></span>
                </span>
                <span class="gloss-name">自定义条目</span>
                <span class="gloss-count" id="customGlossCount"></span>
            </div>
            <textarea id="customGlossaryInput" rows="4" spellcheck="false" hidden
                placeholder="the Fed=美联储&#10;quantitative easing=量化宽松"></textarea>
        </section>

        <!-- 服务地址（运行状态与启动/停止已移到主视图） -->
        <section class="card svc">
            <div class="sec-title">服务地址</div>
            <input type="text" id="serverUrl" class="addr" spellcheck="false">
            <p class="gloss-hint">本地模型状态与启停按钮在主页顶部</p>
        </section>
    </main>

    <script src="glossaries.js"></script>
    <script src="popup.js"></script>
</body>

</html>
